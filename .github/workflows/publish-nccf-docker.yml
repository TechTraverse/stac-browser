name: Build and Publish NCCF Docker Image

on:
  push:
    branches:
      - nccf-stac-browser

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nccf-stac-browser

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract short commit SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Set lowercase repository owner
        id: repo
        run: echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            pathPrefix=/stac/browser/
            historyMode=history
            DYNAMIC_CONFIG=true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.OWNER_LOWER }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.OWNER_LOWER }}/${{ env.IMAGE_NAME }}:nccf-stac-browser-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.OWNER_LOWER }}/${{ env.IMAGE_NAME }}:nccf-stac-browser-latest
          cache-to: type=inline

